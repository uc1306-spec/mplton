<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명플턴의 메모 - Pro Investment Insights</title>
    <!-- Tailwind CSS for Toss-like modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        toss: {
                            red: '#FF3B30',
                            redHover: '#E03228',
                            bg: '#F8F9FA',
                            card: '#FFFFFF',
                            textMain: '#191F28',
                            textSub: '#8B95A1',
                            border: '#E5E8EB',
                            lightRed: '#FFF2F2'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        * {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            box-sizing: border-box;
        }
        body {
            background-color: #F8F9FA;
            color: #191F28;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- 사이드바 네비게이션 -->
    <aside class="w-72 bg-white border-r border-toss-border flex flex-col justify-between p-6 select-none z-10">
        <div>
            <!-- 로고 영역 -->
            <div class="flex items-center gap-3 mb-6 px-2 cursor-pointer" onclick="goHome()">
                <div class="w-10 h-10 rounded-2xl bg-toss-lightRed flex items-center justify-center text-toss-red font-bold text-xl shadow-xs">
                    📝
                </div>
                <div>
                    <h1 class="font-bold text-lg text-toss-textMain tracking-tight">명플턴의 메모</h1>
                    <p class="text-xs text-toss-textSub font-medium">Pro Investment View</p>
                </div>
            </div>

            <!-- 폴더 섹션 -->
            <div class="space-y-3">
                <div class="flex items-center justify-between px-2">
                    <span class="text-xs font-bold text-toss-textSub tracking-wider uppercase">메모 분류 폴더</span>
                    <!-- 운영자 한정 폴더 추가 버튼 -->
                    <button id="addFolderBtn" class="w-6 h-6 rounded-lg bg-toss-lightRed text-toss-red font-bold flex items-center justify-center hover:bg-red-100 transition hidden" onclick="openFolderModal()" title="폴더 추가">+</button>
                </div>
                <ul id="folderList" class="space-y-1">
                    <li class="flex items-center justify-between px-3.5 py-2.5 rounded-xl cursor-pointer text-sm font-semibold text-toss-red bg-toss-lightRed transition" onclick="selectFolder('all')">
                        <span>📝 전체 보기</span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- 좌측 하단 로그인 / 회원가입 및 세션 관리 -->
        <div id="authSection" class="pt-4 border-t border-toss-border flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <span id="authUserInfo" class="text-xs font-semibold text-toss-textMain truncate">방문자 모드</span>
                <button id="authBtn" class="text-xs font-bold text-toss-red hover:underline bg-toss-lightRed px-3 py-1.5 rounded-lg border border-red-100 shadow-2xs">로그인</button>
            </div>
            <div class="text-center">
                <span class="text-[11px] text-toss-textSub font-medium">© 2026 Myeongpleton Insights</span>
            </div>
        </div>
    </aside>

    <!-- 메인 컨텐츠 영역 (목록 뷰) -->
    <main id="mainView" class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-20 bg-white border-b border-toss-border px-8 flex justify-between items-center z-15 shrink-0">
            <div class="flex items-center gap-4">
                <h2 id="currentFolderTitle" class="text-2xl font-bold text-toss-textMain tracking-tight">전체 보기</h2>
            </div>
            <div class="flex items-center gap-3">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="종목, 핵심 키워드 검색..." oninput="renderCards()" class="w-72 bg-toss-bg border border-toss-border rounded-xl px-4 py-2.5 text-sm outline-none focus:border-toss-red focus:bg-white transition">
                </div>
                <!-- 운영자 한정 새 메모 작성 버튼 -->
                <button id="writeMemoBtn" onclick="openWriteModal()" class="bg-toss-red hover:bg-toss-redHover text-white font-bold px-5 py-2.5 rounded-xl text-sm shadow-sm transition flex items-center gap-2 hidden">
                    <span>+ 새 메모 작성</span>
                </button>
            </div>
        </header>

        <div class="flex-1 p-8 overflow-y-auto">
            <div id="contentContainer" class="space-y-8">
                <!-- 월별로 그룹화되어 렌더링됩니다 -->
            </div>
        </div>
    </main>

    <!-- 상세 페이지 뷰 (팝업 대신 전체 화면으로 전환) -->
    <main id="detailView" class="flex-1 flex flex-col h-screen overflow-hidden hidden bg-white">
        <header class="h-20 border-b border-toss-border px-8 flex justify-between items-center z-15 shrink-0 bg-white">
            <button onclick="goHome()" class="flex items-center gap-2 font-bold text-sm text-toss-textMain hover:text-toss-red transition bg-toss-bg px-4 py-2.5 rounded-xl border border-toss-border">
                <span>← 목록으로 돌아가기</span>
            </button>
            <div id="operatorCardActions" class="hidden flex gap-2">
                <button onclick="deleteCurrentCard()" class="text-xs font-bold text-red-500 bg-red-50 hover:bg-red-100 px-4 py-2.5 rounded-xl transition border border-red-100">이 메모 영구 삭제</button>
            </div>
        </header>

        <div class="flex-1 p-10 overflow-y-auto flex justify-start">
            <div class="w-full max-w-4xl space-y-8 pb-20 text-left">
                <div class="flex flex-col gap-3 border-b border-toss-border pb-6 text-left">
                    <div class="flex items-center gap-3">
                        <span id="detailFolderBadge" class="text-xs bg-toss-lightRed text-toss-red font-bold px-3 py-1 rounded-full"></span>
                        <span id="detailDateTag" class="text-xs text-toss-textSub font-medium"></span>
                    </div>
                    <h2 id="detailTitle" class="text-3xl font-extrabold text-toss-textMain tracking-tight text-left"></h2>
                </div>

                <div class="space-y-6 text-left">
                    <img id="detailImg" src="" alt="첨부 이미지" class="w-full max-h-[500px] object-cover rounded-3xl hidden border border-toss-border shadow-md">
                    <div id="detailMemo" class="text-base text-toss-textMain leading-relaxed whitespace-pre-wrap bg-toss-bg p-8 rounded-3xl border border-toss-border shadow-xs text-left"></div>
                </div>

                <!-- 댓글 및 토론방 영역 -->
                <div class="border-t border-toss-border pt-8 space-y-6 text-left">
                    <div class="flex items-center justify-between">
                        <h4 class="text-lg font-bold text-toss-textMain flex items-center gap-2">
                            <span>💬 투자자 토론방 / 의견 남기기</span>
                            <span id="commentCountBadge" class="text-xs bg-toss-lightRed text-toss-red px-2.5 py-0.5 rounded-full font-bold">0</span>
                        </h4>
                    </div>

                    <!-- 댓글 입력 폼 -->
                    <div class="bg-toss-bg p-5 rounded-3xl border border-toss-border space-y-3">
                        <div class="flex flex-col md:flex-row gap-3">
                            <input type="text" id="commentAuthor" placeholder="필명 입력" class="w-full md:w-48 bg-white border border-toss-border rounded-xl px-4 py-3 text-sm outline-none focus:border-toss-red font-medium">
                            <input type="text" id="commentText" placeholder="투자 관점에 대한 의견을 남겨보세요..." onkeydown="if(event.key==='Enter') addComment()" class="flex-1 bg-white border border-toss-border rounded-xl px-4 py-3 text-sm outline-none focus:border-toss-red">
                            <button onclick="addComment()" class="bg-toss-red hover:bg-toss-redHover text-white font-bold px-6 py-3 rounded-xl text-sm transition shadow-sm shrink-0">등록하기</button>
                        </div>
                    </div>

                    <!-- 댓글 목록 리스트 -->
                    <div id="commentList" class="space-y-3">
                        <!-- 댓글이 동적으로 렌더링됩니다 -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 메모 작성 모달 (운영자 전용) -->
    <div id="writeModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg p-7 shadow-2xl flex flex-col gap-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold text-toss-textMain">새 주식 인사이츠 작성</h3>
                <button onclick="closeWriteModal()" class="w-8 h-8 rounded-full bg-toss-bg text-toss-textSub hover:bg-gray-200 font-bold flex items-center justify-center">×</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-toss-textSub mb-1.5 uppercase">작성일자</label>
                    <input type="date" id="writeDate" class="w-full bg-toss-bg border border-toss-border rounded-xl p-3 text-sm outline-none focus:border-toss-red">
                </div>
                <div>
                    <label class="block text-xs font-bold text-toss-textSub mb-1.5 uppercase">분류 폴더</label>
                    <select id="writeFolderSelect" class="w-full bg-toss-bg border border-toss-border rounded-xl p-3 text-sm outline-none focus:border-toss-red"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-toss-textSub mb-1.5 uppercase">투자 관점 태그</label>
                    <select id="writeTag" class="w-full bg-toss-bg border border-toss-border rounded-xl p-3 text-sm outline-none focus:border-toss-red">
                        <option value="📈 매수 관점">📈 매수 관점</option>
                        <option value="📉 매도 관점">📉 매도 관점</option>
                        <option value="💡 기업 분석">💡 기업 분석</option>
                        <option value="⚠️ 리스크 점검">⚠️ 리스크 점검</option>
                        <option value="🌐 거시경제">🌐 거시경제</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-toss-textSub mb-1.5 uppercase">메모 제목 / 종목명</label>
                    <input type="text" id="writeTitle" placeholder="예: 엔비디아 2분기 실적 리뷰 및 밸류에이션 점검" class="w-full bg-toss-bg border border-toss-border rounded-xl p-3 text-sm outline-none focus:border-toss-red">
                </div>
                <div>
                    <label class="block text-xs font-bold text-toss-textSub mb-1.5 uppercase">차트/썸네일 이미지 첨부 (직접 업로드)</label>
                    <input type="file" id="writeImageFile" accept="image/*" class="w-full bg-toss-bg border border-toss-border rounded-xl p-3 text-sm outline-none focus:border-toss-red file:mr-4 file:py-1 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-toss-red file:text-white hover:file:bg-toss-redHover cursor-pointer">
                    <input type="hidden" id="writeImageBase64" value="">
                </div>
                <div>
                    <label class="block text-xs font-bold text-toss-textSub mb-1.5 uppercase">상세 리포트 및 투자 뷰 내용</label>
                    <textarea id="writeMemo" rows="6" placeholder="핵심 투자포인트, 목표주가, 리스크 요인 등을 상세히 작성하세요..." class="w-full bg-toss-bg border border-toss-border rounded-xl p-3 text-sm outline-none focus:border-toss-red resize-none"></textarea>
                </div>
            </div>

            <button onclick="saveCard()" class="w-full bg-toss-red hover:bg-toss-redHover text-white font-bold py-3.5 rounded-xl text-sm shadow-md transition">인사이츠 발행하기</button>
        </div>
    </div>

    <!-- 폴더 추가 모달 (운영자 전용) -->
    <div id="folderModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-toss-textMain">새 분류 폴더 추가</h3>
                <button onclick="closeFolderModal()" class="w-7 h-7 rounded-full bg-toss-bg text-toss-textSub font-bold flex items-center justify-center">×</button>
            </div>
            <div>
                <label class="block text-xs font-bold text-toss-textSub mb-1.5 uppercase">폴더 이름</label>
                <input type="text" id="newFolderNameInput" placeholder="예: 반도체 밸류체인" class="w-full bg-toss-bg border border-toss-border rounded-xl p-3 text-sm outline-none focus:border-toss-red">
            </div>
            <button onclick="confirmAddFolder()" class="w-full bg-toss-red text-white font-bold py-3 rounded-xl text-sm shadow-md">폴더 생성</button>
        </div>
    </div>

    <!-- 폴더명 수정 모달 (운영자 전용) -->
    <div id="editFolderModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-toss-textMain">분류 폴더명 수정</h3>
                <button onclick="closeEditFolderModal()" class="w-7 h-7 rounded-full bg-toss-bg text-toss-textSub font-bold flex items-center justify-center">×</button>
            </div>
            <div>
                <label class="block text-xs font-bold text-toss-textSub mb-1.5 uppercase">새 폴더 이름</label>
                <input type="text" id="editFolderNameInput" class="w-full bg-toss-bg border border-toss-border rounded-xl p-3 text-sm outline-none focus:border-toss-red">
            </div>
            <button onclick="confirmEditFolder()" class="w-full bg-toss-red text-white font-bold py-3 rounded-xl text-sm shadow-md">수정 완료</button>
        </div>
    </div>

    <!-- 로그인 / 회원가입 및 프로필 관리 모달 -->
    <div id="loginModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl w-full max-w-md p-7 shadow-2xl flex flex-col gap-5">
            <div class="flex justify-between items-center border-b border-toss-border pb-4">
                <div class="flex items-center gap-2">
                    <span class="text-toss-red font-bold text-lg">→</span>
                    <h3 id="authModalTitle" class="text-lg font-bold text-toss-textMain">로그인 / 회원가입</h3>
                </div>
                <button onclick="closeLoginModal()" class="w-7 h-7 rounded-full bg-toss-bg text-toss-textSub font-bold flex items-center justify-center">×</button>
            </div>
            
            <!-- 로그인 전 폼 -->
            <div id="loginFormContainer" class="space-y-4">
                <button onclick="handleGoogleLogin()" class="w-full bg-white border border-toss-border hover:bg-gray-50 text-toss-textMain font-bold py-3 rounded-2xl text-sm shadow-xs flex items-center justify-center gap-3 transition">
                    <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.3 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 11.7s.43 3.58 1.19 5.12l4.09-2.55z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.7 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                    <span>구글 계정으로 로그인</span>
                </button>

                <div class="flex items-center my-2">
                    <div class="flex-1 border-t border-toss-border"></div>
                    <span class="px-3 text-xs text-toss-textSub">또는 이메일로 로그인</span>
                    <div class="flex-1 border-t border-toss-border"></div>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-toss-textSub mb-1 uppercase">이메일</label>
                        <input type="email" id="loginEmail" placeholder="이메일 입력" class="w-full bg-toss-bg border border-toss-border rounded-xl p-3 text-sm outline-none focus:border-toss-red">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-toss-textSub mb-1 uppercase">비밀번호</label>
                        <input type="password" id="loginPassword" placeholder="비밀번호 입력" class="w-full bg-toss-bg border border-toss-border rounded-xl p-3 text-sm outline-none focus:border-toss-red">
                    </div>
                </div>
                <div class="flex gap-2 pt-1">
                    <button onclick="executeAuthAction(false)" class="flex-1 bg-toss-red hover:bg-toss-redHover text-white font-bold py-3 rounded-2xl text-sm shadow-md transition">로그인</button>
                    <button onclick="executeAuthAction(true)" class="flex-1 bg-gray-100 hover:bg-gray-200 text-toss-textMain font-bold py-3 rounded-2xl text-sm transition">회원가입</button>
                </div>
            </div>

            <!-- 로그인된 상태의 팝업 뷰 -->
            <div id="loggedInPopupContent" class="space-y-4 hidden">
                <div>
                    <span class="block text-xs font-bold text-toss-textSub mb-1.5">현재 로그인된 계정</span>
                    <div id="popupUserEmail" class="w-full bg-toss-bg border border-toss-border rounded-2xl p-3.5 text-sm font-bold text-emerald-600 truncate"></div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-toss-textSub">내 닉네임 설정</label>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="myNicknameInput" placeholder="사용할 닉네임을 입력하세요" class="flex-1 bg-toss-bg border border-toss-border rounded-2xl px-4 py-3 text-sm outline-none focus:border-emerald-500 font-medium">
                        <button onclick="saveMyNickname()" class="px-5 py-3 text-xs font-bold text-white bg-emerald-500 hover:bg-emerald-600 rounded-2xl transition shadow-xs shrink-0">저장</button>
                    </div>
                </div>

                <div class="pt-2 space-y-2">
                    <button onclick="handleAuthClick()" class="w-full bg-gray-100 hover:bg-gray-200 text-toss-textMain font-bold py-3.5 rounded-2xl text-sm transition">로그아웃</button>
                    <button onclick="handleAccountWithdrawal()" class="w-full bg-red-50 hover:bg-red-100 text-red-500 font-bold py-3.5 rounded-2xl text-sm transition border border-red-100">회원탈퇴 및 데이터 삭제</button>
                </div>

                <div class="text-center pt-2">
                    <button onclick="closeLoginModal()" class="text-xs font-bold text-toss-textSub hover:text-toss-textMain">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 커스텀 알림/확인 모달 -->
    <div id="customDialogModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center z-60 p-4">
        <div class="bg-white rounded-3xl w-full max-w-xs p-6 shadow-2xl text-center flex flex-col gap-5">
            <p id="customDialogMsg" class="text-sm font-semibold text-toss-textMain leading-relaxed">알림 메시지</p>
            <div id="customDialogActions" class="flex gap-2 justify-center">
                <button onclick="closeCustomDialog()" class="w-full bg-toss-red text-white font-bold py-2.5 rounded-xl text-sm shadow-sm">확인</button>
            </div>
        </div>
    </div>

    <!-- 파이어베이스 및 데이터 로직 구현 -->

        function initFirestoreSync() {
            const foldersRef = collection(db, 'artifacts', appId, 'public', 'data', 'folders');
            onSnapshot(foldersRef, async (snapshot) => {
                if (!snapshot.empty) {
                    const loadedFolders = [];
                    snapshot.forEach(docSnap => {
                        loadedFolders.push(docSnap.data().name);
                    });
                    if (loadedFolders.length > 0) folders = loadedFolders;
                } else if (folders.length > 0) {
                    for (let f of folders) {
                        try {
                            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'folders', f), { name: f });
                        } catch (e) {
                            console.warn("Folder init write ignored:", e.message);
                        }
                    }
                }
                renderFolders();
            }, (error) => console.warn("Folders sync note:", error.message));

            const cardsRef = collection(db, 'artifacts', appId, 'public', 'data', 'cards');
            onSnapshot(cardsRef, (snapshot) => {
                cards = [];
                snapshot.forEach(docSnap => {
                    cards.push({ docId: docSnap.id, ...docSnap.data() });
                });
                cards.sort((a, b) => b.id - a.id);
                renderCards();
                if (currentViewingId) {
                    openDetailView(currentViewingId);
                }
            }, (error) => console.warn("Cards sync note:", error.message));
        }

                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'folders', folderName), { name: folderName });

            if (!newName) {

                return;
            }
            if (folders.includes(newName)) {
                showCustomAlert('이미 존재하는 폴더 이름입니다.');
                return;
            }
            const oldName = editingFolderTarget;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'folders', newName), { name: newName });
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'folders', oldName));
                
                for (let card of cards) {
                    if (card.folder === oldName) {
                        card.folder = newName;
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cards', String(card.id)), card);
                    }
                }

                if (currentFolder === oldName) currentFolder = newName;
                closeEditFolderModal();
                showCustomAlert('폴더명이 수정되었습니다.');
            } catch (err) {
                console.error("Folder rename error:", err);
                showCustomAlert('폴더명 수정 중 오류가 발생했습니다.');

        window.addComment = async function() {
            const author = document.getElementById('commentAuthor').value.trim();
            const text = document.getElementById('commentText').value.trim();

            if (!author || !text) {
                showCustomAlert('필명과 댓글 내용을 모두 입력해주세요.');
                return;
            }

            const card = cards.find(c => c.id === currentViewingId);
            if (!card) return;

            const newComment = {
                id: Date.now(),
                author,
                text,
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            const updatedComments = card.comments ? [...card.comments, newComment] : [newComment];

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cards', String(card.id)), {
                    ...card,
                    comments: updatedComments
                });
                document.getElementById('commentText').value = '';
            } catch (err) {
                showCustomAlert('댓글 등록 중 오류가 발생했습니다.');
            }

        window.deleteComment = async function(commentId) {
            const card = cards.find(c => c.id === currentViewingId);
            if (!card) return;

            showCustomConfirm('이 댓글을 삭제하시겠습니까?', async () => {
                const updatedComments = (card.comments || []).filter(c => c.id !== commentId);
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cards', String(card.id)), {
                        ...card,
                        comments: updatedComments
                    });

                    showCustomAlert('댓글 삭제 중 오류가 발생했습니다.');

        function renderComments(card) {
            const listEl = document.getElementById('commentList');
            const countBadge = document.getElementById('commentCountBadge');
            const comments = card.comments || [];

            countBadge.innerText = comments.length;

            if (comments.length === 0) {
                listEl.innerHTML = `<div class="text-xs text-toss-textSub text-center py-6 bg-white rounded-2xl border border-toss-border">등록된 의견이 없습니다. 첫 번째 투자 의견을 남겨보세요!</div>`;
                return;
            }

            listEl.innerHTML = '';
            comments.forEach(c => {
                listEl.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl border border-toss-border flex justify-between items-start gap-4 shadow-2xs">
                        <div class="flex flex-col gap-1.5 flex-1">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-toss-textMain">${escapeHtml(c.author)}</span>
                                <span class="text-[10px] text-toss-textSub">${c.date}</span>
                            </div>
                            <p class="text-xs text-toss-textMain leading-relaxed">${escapeHtml(c.text)}</p>
                        </div>
                        <button onclick="deleteComment(${c.id})" class="text-xs text-toss-textSub hover:text-red-500 font-medium px-2 py-1 rounded transition">삭제</button>
                    </div>
                `;
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

                folderList.innerHTML += `

        window.renderCards = function() {
            const container = document.getElementById('contentContainer');
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const isOperator = currentUser && currentUser.email === OPERATOR_EMAIL;

            let filtered = cards.filter(card => {
                const matchFolder = (currentFolder === 'all' || card.folder === currentFolder);
                const matchKeyword = card.title.toLowerCase().includes(keyword) || card.memo.toLowerCase().includes(keyword) || card.date.includes(keyword);
                return matchFolder && matchKeyword;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="py-20 text-center flex flex-col items-center justify-center gap-3 bg-white rounded-3xl border border-toss-border shadow-xs">
                        <span class="text-3xl">🔍</span>
                        <p class="text-sm font-semibold text-toss-textSub">등록된 주식 인사이츠 메모가 없습니다.</p>
                    </div>
                `;
                return;
            }

            const grouped = {};
            filtered.forEach(card => {
                const cleanDate = card.date.replace(/\./g, '-');
                const ym = cleanDate.length >= 7 ? cleanDate.substring(0, 7) : '기타';
                if (!grouped[ym]) grouped[ym] = [];
                grouped[ym].push(card);
            });

            const sortedMonths = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

            container.innerHTML = '';
            sortedMonths.forEach(ym => {
                const [year, month] = ym.split('-');
                const monthTitle = year && month ? `${year}년 ${parseInt(month, 10)}월` : ym;

                let monthHtml = `
                    <div class="space-y-4">
                        <div class="flex items-center gap-4">
                            <span class="text-sm font-bold text-toss-red bg-toss-lightRed px-3 py-1 rounded-full">${monthTitle}</span>
                            <div class="flex-1 border-t border-toss-border"></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                `;

                grouped[ym].forEach(card => {
                    let thumbHtml = card.image ? `<img src="${card.image}" class="w-full h-44 object-cover" alt="썸네일">` : '';
                    const commentCount = card.comments ? card.comments.length : 0;
                    monthHtml += `
                        <div onclick="openDetailView(${card.id})" class="bg-white rounded-2xl border border-toss-border overflow-hidden cursor-pointer hover:shadow-lg transition flex flex-col justify-between group">
                            <div>
                                ${thumbHtml}
                                <div class="p-5 flex flex-col gap-3">
                                    <div class="flex justify-between items-center">
                                        <span class="text-xs text-toss-textSub font-medium">${card.date}</span>
                                        <span class="text-xs bg-red-50 text-toss-red font-bold px-2 py-0.5 rounded-md">${card.tag}</span>
                                    </div>
                                    <h3 class="font-bold text-toss-textMain text-base leading-snug line-clamp-2 group-hover:text-toss-red transition">${card.title}</h3>
                                </div>
                            </div>
                            <div class="px-5 py-3.5 border-t border-toss-border flex justify-between items-center bg-gray-50/50">
                                <span class="text-xs font-semibold text-toss-textSub">📌 ${card.folder} | 💬 ${commentCount}</span>
                                ${isOperator ? `<button onclick="deleteCardFromGrid(event, ${card.id})" class="text-xs text-red-500 hover:bg-red-50 px-2 py-1 rounded font-bold transition">삭제</button>` : ''}
                            </div>
                        </div>
                    `;
                });

                monthHtml += `</div></div>`;
                container.innerHTML += monthHtml;
            });
        }

        function showCustomAlert(msg) {
            const modal = document.getElementById('customDialogModal');
            document.getElementById('customDialogMsg').innerText = msg;
            document.getElementById('customDialogActions').innerHTML = `<button onclick="closeCustomDialog()" class="w-full bg-toss-red text-white font-bold py-2.5 rounded-xl text-sm shadow-sm">확인</button>`;
            modal.style.display = 'flex';
        }

        function showCustomConfirm(msg, onConfirm) {
            const modal = document.getElementById('customDialogModal');
            document.getElementById('customDialogMsg').innerText = msg;
            window._tempConfirm = onConfirm;
            document.getElementById('customDialogActions').innerHTML = `
                <button onclick="closeCustomDialog()" class="flex-1 bg-gray-100 text-toss-textMain font-bold py-2.5 rounded-xl text-sm">취소</button>
                <button onclick="closeCustomDialog(); if(window._tempConfirm) window._tempConfirm();" class="flex-1 bg-toss-red text-white font-bold py-2.5 rounded-xl text-sm shadow-sm">확인</button>
            `;
            modal.style.display = 'flex';
        }

        window.closeCustomDialog = function() {
            document.getElementById('customDialogModal').style.display = 'none';
        }

        window.closeFolderModal = closeFolderModal;
        window.closeLoginModal = closeLoginModal;
        window.closeEditFolderModal = closeEditFolderModal;
    </script>
</body>
</html>
