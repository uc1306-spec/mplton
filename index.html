<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명플턴의 관점</title>
    
    <!-- 웹탭 파비콘 (Favicon) 설정 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='sunGrad' x1='20' y1='10' x2='80' y2='70'><stop offset='0%' stop-color='%23FCD34D'/><stop offset='100%' stop-color='%23F59E0B'/></linearGradient><linearGradient id='arrowGrad' x1='10' y1='90' x2='90' y2='30'><stop offset='0%' stop-color='%2334D399'/><stop offset='100%' stop-color='%2310B981'/></linearGradient><linearGradient id='chartGrad' x1='20' y1='80' x2='80' y2='40'><stop offset='0%' stop-color='%231E4ED8'/><stop offset='100%' stop-color='%233B82F6'/></linearGradient></defs><circle cx='50' cy='42' r='38' fill='url(%23sunGrad)'/><path d='M 32 58 C 30 45 40 32 52 32 C 58 32 64 36 64 45 L 56 58 Z' fill='%230F172A'/><circle cx='44' cy='27' r='8' fill='%230F172A'/><path d='M 48 26 L 76 17 L 78 23 L 50 31 Z' fill='%230F172A'/><path d='M 28 78 L 42 62 L 56 72 L 74 48 L 84 78 Z' fill='url(%23chartGrad)'/><rect x='34' y='70' width='7' height='12' rx='1.5' fill='%231E3A8A'/><rect x='45' y='64' width='7' height='18' rx='1.5' fill='%231D4ED8'/><rect x='56' y='56' width='7' height='26' rx='1.5' fill='%232563EB'/><rect x='67' y='48' width='7' height='34' rx='1.5' fill='%233B82F6'/><path d='M 12 70 C 25 88 60 88 84 42' stroke='url(%23arrowGrad)' stroke-width='7' stroke-linecap='round' fill='none'/><path d='M 85 40 L 72 45 L 83 55 Z' fill='%2310B981'/></svg>">

    <!-- 오픈 그래프 (Open Graph) 메타 태그 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="명플턴의 관점">
    <meta property="og:description" content="명플턴의 주식 투자 관점 및 인사이트 아카이브">
    <meta property="og:image" content="https://placehold.co/1200x630/0F172A/3B82F6?text=Myungpleton+View">
    <meta property="og:url" content="https://mpltonnote.firebaseapp.com">

    <!-- Tailwind CSS CDN 및 Pretendard 폰트 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        @keyframes pulseNew {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.05); }
        }
        .new-badge-pulse { animation: pulseNew 2s infinite ease-in-out; }
        .smooth-scroll { -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-[#0F172A] min-h-screen flex flex-col select-none">

    <!-- 커스텀 다이얼로그 모달 -->
    <div id="customDialog" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[9999] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-slate-200 transform transition-all flex flex-col gap-3.5">
            <h3 id="dialogTitle" class="text-base font-bold text-slate-900">알림</h3>
            <p id="dialogMessage" class="text-xs text-slate-600 leading-relaxed break-words"></p>
            <div id="dialogButtons" class="flex gap-2 justify-end mt-1">
                <button id="dialogConfirm" class="px-4 py-2 bg-[#2563EB] text-white rounded-xl text-xs font-semibold hover:bg-[#1D4ED8] transition shadow-sm">확인</button>
                <button id="dialogCancel" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-200 transition hidden">취소</button>
            </div>
        </div>
    </div>

    <!-- 이미지 라이트박스 모달 -->
    <div id="imageLightboxModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[99999] hidden flex items-center justify-center p-4" onclick="closeLightbox()">
        <div class="relative max-w-7xl max-h-screen w-full h-full flex items-center justify-center p-2" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/10 text-white hover:bg-white/20 flex items-center justify-center text-xl font-bold transition z-10">✕</button>
            <img id="lightboxImg" class="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl" alt="원본 이미지 확대">
        </div>
    </div>

    <!-- 통합 상단 헤더 (Sticky) -->
    <header class="sticky top-0 bg-white/90 backdrop-blur-md border-b border-slate-200/80 z-40 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-3">
            
            <!-- 브랜드 로고 -->
            <div onclick="resetHomeView()" class="flex items-center gap-2.5 cursor-pointer">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-amber-50 to-blue-50 flex items-center justify-center shadow-sm border border-amber-200/80 p-0.5 shrink-0 overflow-hidden">
                    <svg class="w-full h-full" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="sunGrad" x1="20" y1="10" x2="80" y2="70">
                                <stop offset="0%" stop-color="#FCD34D"/>
                                <stop offset="100%" stop-color="#F59E0B"/>
                            </linearGradient>
                            <linearGradient id="arrowGrad" x1="10" y1="90" x2="90" y2="30">
                                <stop offset="0%" stop-color="#34D399"/>
                                <stop offset="100%" stop-color="#10B981"/>
                            </linearGradient>
                            <linearGradient id="chartGrad" x1="20" y1="80" x2="80" y2="40">
                                <stop offset="0%" stop-color="#1E4ED8"/>
                                <stop offset="100%" stop-color="#3B82F6"/>
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="42" r="38" fill="url(#sunGrad)"/>
                        <path d="M 32 58 C 30 45 40 32 52 32 C 58 32 64 36 64 45 L 56 58 Z" fill="#0F172A"/>
                        <circle cx="44" cy="27" r="8" fill="#0F172A"/>
                        <path d="M 48 26 L 76 17 L 78 23 L 50 31 Z" fill="#0F172A"/>
                        <path d="M 28 78 L 42 62 L 56 72 L 74 48 L 84 78 Z" fill="url(#chartGrad)"/>
                        <rect x="34" y="70" width="7" height="12" rx="1.5" fill="#1E3A8A"/>
                        <rect x="45" y="64" width="7" height="18" rx="1.5" fill="#1D4ED8"/>
                        <rect x="56" y="56" width="7" height="26" rx="1.5" fill="#2563EB"/>
                        <rect x="67" y="48" width="7" height="34" rx="1.5" fill="#3B82F6"/>
                        <path d="M 12 70 C 25 88 60 88 84 42" stroke="url(#arrowGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
                        <path d="M 85 40 L 72 45 L 83 55 Z" fill="#10B981"/>
                    </svg>
                </div>
                <div class="flex flex-col sm:flex-row sm:items-center gap-0.5 sm:gap-2">
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-lg sm:text-xl tracking-tight text-slate-900 whitespace-nowrap">
                            명플턴의 <span class="text-[#2563EB]">관점</span>
                        </span>
                        <span id="pubNewBadgeNav" class="hidden text-xs bg-amber-500 text-white font-bold px-2.5 py-0.5 rounded-full new-badge-pulse shadow-sm">NEW</span>
                    </div>
                    <span class="text-[11px] sm:text-xs text-slate-500 font-medium sm:border-l sm:border-slate-300 sm:pl-2 leading-tight">
                        관심있게 보는 종목이나 매매일지 등을 올립니다
                    </span>
                </div>
            </div>

            <!-- 우측 액션 영역 -->
            <div class="flex items-center gap-2 shrink-0">
                <span id="authStatusText" class="text-xs sm:text-sm text-slate-500 font-medium hidden md:inline-block">비로그인 (읽기 전용)</span>
                
                <button onclick="handleAuthButtonClick()" id="operatorToggleBtn" class="px-3.5 py-2 bg-slate-50 hover:bg-slate-100 text-slate-700 rounded-xl text-xs sm:text-sm font-semibold transition border border-slate-200 whitespace-nowrap">
                    운영자 로그인
                </button>

                <button id="writeMemoHeaderBtn" onclick="openWriteModal()" class="hidden bg-[#2563EB] hover:bg-[#1D4ED8] text-white px-4 py-2 rounded-xl font-bold text-xs sm:text-sm shadow-md shadow-blue-500/10 transition flex items-center gap-1.5 whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                    새 메모
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-4 flex flex-col gap-4">
        
        <!-- 검색 및 필터 컨트롤 바 -->
        <div class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm flex flex-col md:flex-row items-stretch md:items-center justify-between gap-2.5">
            
            <!-- 박스형 필터 컨트롤 -->
            <div class="grid grid-cols-2 md:flex items-center gap-2 w-full md:w-auto">
                <!-- 월별 드롭다운 박스 -->
                <select id="monthFilterSelect" onchange="onMonthSelectChange(this.value)" class="w-full md:w-auto bg-slate-50 border border-slate-200 text-slate-700 text-xs sm:text-sm rounded-xl px-3 py-2.5 outline-none focus:border-[#2563EB] focus:bg-white transition font-semibold cursor-pointer">
                    <option value="all">📅 전체 월별</option>
                </select>

                <!-- 태그 필터 드롭다운 박스 -->
                <select id="tagFilter" onchange="renderCards()" class="w-full md:w-auto bg-slate-50 border border-slate-200 text-slate-700 text-xs sm:text-sm rounded-xl px-3 py-2.5 outline-none focus:border-[#2563EB] focus:bg-white transition font-semibold cursor-pointer">
                    <option value="all">🏷️ 전체 태그</option>
                    <option value="매수 관점">📈 매수 관점</option>
                    <option value="매도 관점">📉 매도 관점</option>
                    <option value="기업 분석">💡 기업 분석</option>
                    <option value="익절">✨ 익절</option>
                    <option value="손절">🛡️ 손절</option>
                    <option value="기타">📌 기타</option>
                </select>
            </div>

            <!-- 검색 입력창 -->
            <div class="relative w-full md:w-64 shrink-0">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="searchInput" placeholder="종목, 키워드 검색..." oninput="renderCards()" class="w-full pl-10 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm outline-none focus:border-[#2563EB] focus:bg-white transition">
            </div>
        </div>

        <!-- 카드 그리드 영역 -->
        <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- 카드 목록 JS 렌더링 -->
        </div>
    </main>

    <!-- 푸터 영역 -->
    <footer class="mt-auto border-t border-slate-200/80 bg-white py-6 text-center text-xs text-slate-400 font-medium">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-2">
            <p>© 망고컴패니. All rights reserved.</p>
            <p class="text-[11px] text-slate-400">명플턴의 관점</p>
        </div>
    </footer>

    <!-- 글 작성 / 수정 모달 -->
    <div id="writeModal" onclick="closeWriteModal()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div onclick="event.stopPropagation()" class="bg-white border border-slate-200 rounded-3xl max-w-xl w-full p-5 sm:p-6 shadow-2xl transform transition-all flex flex-col gap-4 my-6">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <div>
                    <h2 id="writeModalHeading" class="text-base font-bold text-slate-900">새 관점 기록</h2>
                    <p class="text-[11px] text-slate-500 font-medium">투자 인사이츠와 관점을 기록하세요 (운영자 전용).</p>
                </div>
                <button onclick="closeWriteModal()" class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition text-sm">✕</button>
            </div>

            <input type="hidden" id="editCardId" value="">

            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-bold text-slate-500">기록 일자</label>
                <input type="date" id="writeDate" class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-[#2563EB] focus:bg-white transition font-medium">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="flex flex-col gap-1">
                    <label class="text-[11px] font-bold text-slate-500">태그</label>
                    <select id="writeTag" class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-[#2563EB] focus:bg-white transition font-medium">
                        <option value="매수 관점">📈 매수 관점</option>
                        <option value="매도 관점">📉 매도 관점</option>
                        <option value="기업 분석">💡 기업 분석</option>
                        <option value="익절">✨ 익절</option>
                        <option value="손절">🛡️ 손절</option>
                        <option value="기타">📌 기타</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-[11px] font-bold text-slate-500">종목 코드/티커</label>
                    <input type="text" id="writeTicker" placeholder="예: NVDA" class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-[#2563EB] focus:bg-white transition font-medium">
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-[11px] font-bold text-slate-500">매수가 (원/달러)</label>
                    <input type="number" id="writeBuyPrice" placeholder="예: 120000" oninput="calcReturnRate()" class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-[#2563EB] focus:bg-white transition font-medium">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="flex flex-col gap-1">
                    <label class="text-[11px] font-bold text-slate-500">매도가 (원/달러)</label>
                    <input type="number" id="writeSellPrice" placeholder="예: 150000" oninput="calcReturnRate()" class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-[#2563EB] focus:bg-white transition font-medium">
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-[11px] font-bold text-slate-500">자동 계산된 수익률</label>
                    <div id="returnRateDisplay" class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-400 flex items-center h-[38px]">
                        매수가와 매도가 입력 시 자동 계산
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-bold text-slate-500">제목 / 종목명</label>
                <input type="text" id="writeTitle" placeholder="예: 엔비디아 2분기 실적 리뷰 및 관점 정립" class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-[#2563EB] focus:bg-white transition font-medium">
            </div>

            <div class="flex flex-col gap-1">
                <div class="flex justify-between items-center">
                    <label class="text-[11px] font-bold text-slate-500">차트/스크린샷 첨부 (여러 장 선택 가능)</label>
                    <span id="selectedImageCount" class="text-[10px] text-slate-400 font-semibold"></span>
                </div>
                <input type="file" id="writeImage" accept="image/*" multiple onchange="handleImageSelect(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-[#2563EB] hover:file:bg-blue-100 cursor-pointer">
                
                <!-- 선택된 이미지 썸네일 목록 -->
                <div id="writeImagePreviewContainer" class="flex gap-2 overflow-x-auto py-2 hidden smooth-scroll">
                    <!-- JS 동적 렌더링 -->
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-bold text-slate-500">상세 내용</label>
                <textarea id="writeMemo" rows="4" placeholder="투자 핵심 지표, 밸류에이션, 목표가, 체크포인트 등을 자유롭게 기록하세요..." class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-[#2563EB] focus:bg-white transition font-medium resize-y"></textarea>
            </div>

            <button onclick="saveCard()" class="w-full py-3 bg-[#2563EB] hover:bg-[#1D4ED8] text-white rounded-2xl font-bold text-xs shadow-md shadow-blue-500/10 transition mt-1">관점 저장하기</button>
        </div>
    </div>

    <!-- 상세 모달 (여백 압축 및 스크롤 개선) -->
    <div id="detailModal" onclick="closeDetailModal()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-4">
        <div onclick="event.stopPropagation()" class="bg-white border border-slate-200 rounded-2xl sm:rounded-3xl max-w-2xl w-full p-4 sm:p-6 shadow-2xl transform transition-all flex flex-col gap-3 my-auto max-h-[88vh]">
            
            <!-- 상단 헤더: 티커 & 제목 & 닫기 -->
            <div class="flex justify-between items-start border-b border-slate-100 pb-2.5 gap-2 shrink-0">
                <div class="flex-1 pr-1">
                    <div class="flex items-center gap-1.5 mb-1 flex-wrap">
                        <span id="detailTickerBadge" class="hidden bg-slate-100 text-slate-800 text-xs px-2.5 py-0.5 rounded font-bold"></span>
                        <span id="detailTagBadge" class="bg-blue-50 text-[#2563EB] text-xs px-2.5 py-0.5 rounded font-semibold"></span>
                        <span id="detailDateTag" class="text-xs text-slate-400 font-medium ml-auto sm:ml-0"></span>
                    </div>
                    <h2 id="detailTitle" class="text-base sm:text-xl font-bold text-slate-900 leading-snug break-words"></h2>
                </div>
                <button onclick="closeDetailModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition shrink-0 text-base font-bold">✕</button>
            </div>

            <!-- Price & Return Box -->
            <div id="detailPriceReturnBox" class="hidden grid grid-cols-3 gap-2 p-2.5 bg-slate-50 border border-slate-100 rounded-xl text-xs font-semibold shrink-0">
                <div><span class="text-slate-400 block text-xs mb-0.5">매수가</span><span id="detailBuyPrice" class="text-slate-800 text-xs sm:text-sm font-bold">-</span></div>
                <div><span class="text-slate-400 block text-xs mb-0.5">매도가</span><span id="detailSellPrice" class="text-slate-800 text-xs sm:text-sm font-bold">-</span></div>
                <div><span class="text-slate-400 block text-xs mb-0.5">수익률</span><span id="detailReturnRate" class="text-xs sm:text-sm font-bold">-</span></div>
            </div>

            <!-- 본문 스크롤 영역 -->
            <div class="overflow-y-auto smooth-scroll flex-1 space-y-3 pr-1 my-1">
                <!-- 다중 이미지 캐러셀 슬라이더 -->
                <div id="detailCarouselWrapper" class="relative group hidden w-full shrink-0 select-none overflow-hidden rounded-xl bg-slate-900 shadow-sm">
                    <div id="carouselTrack" class="flex transition-transform duration-300 ease-out w-full items-center">
                        <!-- 동적 이미지 슬라이드 -->
                    </div>
                    
                    <button id="carouselPrevBtn" onclick="prevSlide(event)" class="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-slate-900/70 text-white flex items-center justify-center opacity-80 hover:opacity-100 transition text-xs font-bold z-10">❮</button>
                    <button id="carouselNextBtn" onclick="nextSlide(event)" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-slate-900/70 text-white flex items-center justify-center opacity-80 hover:opacity-100 transition text-xs font-bold z-10">❯</button>
                    
                    <div class="absolute bottom-2 right-2 bg-slate-900/80 text-white text-xs font-bold px-2.5 py-0.5 rounded-full backdrop-blur-sm z-10 pointer-events-none flex items-center gap-1 shadow-sm">
                        <span id="carouselCounter">1 / 1</span>
                    </div>

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function compressImage(file, maxWidth = 1024, quality = 0.75) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function getKSTDateString() {
            try {
                return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul' }).format(new Date());
            } catch (e) {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
        }

        const dateInput = document.getElementById('writeDate');
        if(dateInput) dateInput.value = getKSTDateString();

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            getRedirectResult(auth).then((result) => {
                if (result && result.user) {
                    const user = result.user;
                    if (user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                        isOperator = true;
                        currentUserEmail = user.email;
                        showCustomAlert('로그인 성공', '운영자 계정으로 로그인되었습니다.');
                        updateOperatorUI();
                        renderCards();
                    } else {
                        showCustomAlert('권한 없음', `로그인된 계정(${user.email || '익명'})은 운영자가 아닙니다.`);
                    }
                }
            }).catch((error) => {
                console.warn("Redirect auth notice:", error);
            });

            initFirestoreSync();

            onAuthStateChanged(auth, (user) => {
                if(user && user.email) {
                    currentUserEmail = user.email;
                    isOperator = (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
                } else {
                    const bypass = localStorage.getItem('mp_operator_bypass_v20');
                    if(bypass === 'true') {
                        currentUserEmail = ADMIN_EMAIL;
                        isOperator = true;
                    } else {
                        currentUserEmail = null;
                        isOperator = false;
                    }
                }
                updateOperatorUI();
                renderCards();
            });
        } catch(e) {
            console.warn("Firebase initialization fail, running local mode:", e);
            initLocalMode();
        }

        window.resetHomeView = function() {
            currentMonthFilter = 'all';
            const monthSelect = document.getElementById('monthFilterSelect');
            if(monthSelect) monthSelect.value = 'all';
            
            const tagFilter = document.getElementById('tagFilter');

            if(searchInput) searchInput.value = '';

            renderCards();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.handleImageSelect = async function(event) {
            const files = Array.from(event.target.files);
            if(files.length === 0) return;

            const countText = document.getElementById('selectedImageCount');
            if(countText) countText.innerText = '이미지 처리 중...';

            for(const file of files) {
                try {
                    const compressed = await compressImage(file);
                    selectedWriteImages.push(compressed);
                } catch(e) {
                    console.warn("Image compression fail:", e);
                }
            }
            renderWriteImagePreviews();
        };

        window.removeSelectedImage = function(idx) {
            selectedWriteImages.splice(idx, 1);
            renderWriteImagePreviews();
        };

        function renderWriteImagePreviews() {
            const container = document.getElementById('writeImagePreviewContainer');
            const countText = document.getElementById('selectedImageCount');
            if(!container) return;

            if(countText) {
                countText.innerText = selectedWriteImages.length > 0 ? `${selectedWriteImages.length}개 선택됨` : '';
            }

            if(selectedWriteImages.length === 0) {
                container.classList.add('hidden');
                container.innerHTML = '';
                return;
            }

            container.classList.remove('hidden');
            container.innerHTML = selectedWriteImages.map((src, idx) => `
                <div class="relative w-16 h-16 shrink-0 rounded-lg overflow-hidden border border-slate-200 group">
                    <img src="${src}" class="w-full h-full object-cover">
                    <button onclick="removeSelectedImage(${idx})" class="absolute top-0.5 right-0.5 bg-slate-900/80 text-white w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-bold hover:bg-rose-600 transition">✕</button>
                </div>
            `).join('');
        }

        function initFirestoreSync() {
            if(!db) {
                initLocalMode();
                return;
            }
            const publicColRef = collection(db, 'artifacts', appId, 'public', 'data', 'insights');
            
            onSnapshot(query(publicColRef), (snapshot) => {
                remotePublicCards = [];
                snapshot.forEach(docSnap => {
                    remotePublicCards.push({ id: docSnap.id, ...docSnap.data() });
                });
                mergeCards();
            }, (error) => {
                console.warn("Firestore sync fallback:", error.message);
                fetchCloudOnce();
            });
        }

        function fetchCloudOnce(showAlert = false) {
            if(!db) return;
            const publicColRef = collection(db, 'artifacts', appId, 'public', 'data', 'insights');
            getDocs(publicColRef).then(snapshot => {
                remotePublicCards = [];
                snapshot.forEach(docSnap => {
                    remotePublicCards.push({ id: docSnap.id, ...docSnap.data() });
                });
                mergeCards();
                if(showAlert) {
                    showCustomAlert('동기화 완료', '클라우드로부터 최신 게시물을 성공적으로 불러왔습니다.');
                }
            }).catch(err => {
                console.warn("Firestore fetch error:", err);
                if(showAlert) {
                    showCustomAlert('동기화 실패', '클라우드 서버 연결 상태를 확인해주세요.');
                }
            });
        }

        function initLocalMode() {
            mergeCards();
        }

        function mergeCards() {
            const localCards = JSON.parse(localStorage.getItem('mp_cards_v20')) || [];
            const map = new Map();
            localCards.forEach(c => map.set(c.id, c));
            remotePublicCards.forEach(c => map.set(c.id, c));

            // 날짜 내림차순(최신순) + ID 내림차순 정렬
            cards = Array.from(map.values()).sort((a, b) => {
                const dateA = a.date || '';
                const dateB = b.date || '';
                if (dateA !== dateB) {
                    return dateB.localeCompare(dateA);
                }
                return (b.id || '').toString().localeCompare((a.id || '').toString());
            });

            initApp();
        }

        function initApp() {
            renderMonthlySelect();
            renderCards();
            updateOperatorUI();

            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');
            if(targetId) {
                setTimeout(() => {
                    const found = cards.find(c => c.id == targetId);
                    if(found) openDetailModal(targetId);
                }, 400);
            }
        }

        window.calcReturnRate = function() {
            const buyInput = document.getElementById('writeBuyPrice');
            const sellInput = document.getElementById('writeSellPrice');
            const display = document.getElementById('returnRateDisplay');
            if(!buyInput || !sellInput || !display) return;

            const buy = parseFloat(buyInput.value);
            const sell = parseFloat(sellInput.value);

            if(!isNaN(buy) && !isNaN(sell) && buy > 0) {
                const rate = ((sell - buy) / buy) * 100;
                const formatted = rate.toFixed(2);
                if(rate > 0) {
                    display.innerHTML = `<span class="text-red-500 font-bold">+${formatted}% (수익 📈)</span>`;
                } else if(rate < 0) {
                    display.innerHTML = `<span class="text-blue-600 font-bold">${formatted}% (손실 📉)</span>`;
                } else {
                    display.innerHTML = `<span class="text-slate-600 font-bold">0.00% (본전)</span>`;
                }
            } else if(!isNaN(buy) && buy > 0) {
                display.innerHTML = `<span class="text-slate-500 font-medium">매수가 등록됨 (보유 중)</span>`;
            } else {
                display.innerHTML = `<span class="text-slate-400">매수가와 매도가 입력 시 자동 계산</span>`;
            }
        };

                    const user = result.user;

                        isOperator = true;
                        currentUserEmail = user.email;
                        showCustomAlert('로그인 성공', '운영자 계정으로 로그인되었습니다.');
                        updateOperatorUI();
                        renderCards();
                    } else {
                        showCustomAlert('권한 없음', `로그인된 계정(${user?.email || '익명'})은 운영자가 아닙니다.`);
                    }
                }).catch((error) => {
                    console.error("Google login error:", error);
                    if(error.code === 'auth/unauthorized-domain' || error.code === 'auth/popup-blocked') {
                        showCustomAlert('운영자 권한 안내', '팝업이 차단되었습니다. 임시 운영자 권한으로 로그인하시겠습니까?', () => {
                            localStorage.setItem('mp_operator_bypass_v20', 'true');
                            isOperator = true;
                            currentUserEmail = ADMIN_EMAIL;
                            updateOperatorUI();
                            renderCards();
                            showCustomAlert('운영자 모드 활성화', '임시 운영자 권한으로 로그인되었습니다.');
                        });
                    } else {
                        signInWithRedirect(auth, provider).catch(redirectErr => {
                            showCustomAlert('로그인 실패', redirectErr.message || error.message);
                        });
                    }
                });
            } else {
                showCustomAlert('로그아웃', '운영자 계정에서 로그아웃하시겠습니까?', () => {
                    localStorage.removeItem('mp_operator_bypass_v20');

        window.onMonthSelectChange = function(monthVal) {
            currentMonthFilter = monthVal;
            renderCards();
        };

        function renderMonthlySelect() {
            const selectEl = document.getElementById('monthFilterSelect');
            if(!selectEl) return;
            
            const monthsSet = new Set();
            cards.forEach(c => {
                if(c.date && c.date.length >= 7) {
                    monthsSet.add(c.date.substring(0, 7));
                }
            });

            const sortedMonths = Array.from(monthsSet).sort((a, b) => b.localeCompare(a));

            let optionsHtml = `<option value="all">📅 전체 월별</option>`;
            sortedMonths.forEach(m => {
                const [year, month] = m.split('-');
                const label = `${year}년 ${parseInt(month)}월`;
                const isSelected = (currentMonthFilter === m) ? 'selected' : '';
                optionsHtml += `<option value="${m}" ${isSelected}>🗓️ ${label}</option>`;
            });

            selectEl.innerHTML = optionsHtml;
        }

        window.showCustomAlert = function(title, message, onConfirm = null) {
            const dialog = document.getElementById('customDialog');
            const titleEl = document.getElementById('dialogTitle');
            const msgEl = document.getElementById('dialogMessage');
            if(!dialog || !titleEl || !msgEl) return;

            titleEl.innerText = title;
            msgEl.innerText = message;
            
            const confirmBtn = document.getElementById('dialogConfirm');
            const cancelBtn = document.getElementById('dialogCancel');
            
            dialog.classList.remove('hidden');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            
            if (onConfirm) {
                cancelBtn.classList.remove('hidden');
                newConfirm.innerText = '확인';
                newConfirm.onclick = () => { dialog.classList.add('hidden'); onConfirm(); };
                cancelBtn.onclick = () => { dialog.classList.add('hidden'); };
            } else {
                cancelBtn.classList.add('hidden');
                newConfirm.innerText = '확인';
                newConfirm.onclick = () => { dialog.classList.add('hidden'); };
            }
        };

            document.getElementById('writeModal').classList.remove('hidden');

        window.openDetailModal = function(id) {
            currentViewingId = id;
            const card = cards.find(c => c.id == id);
            if(!card) return;

            if(!readPublicCardIds.includes(card.id)) {
                readPublicCardIds.push(card.id);
                localStorage.setItem('mp_read_public_ids_v20', JSON.stringify(readPublicCardIds));
                renderCards();
            }

            document.getElementById('detailTitle').innerText = card.title;
            document.getElementById('detailDateTag').innerText = card.date;

            const tickerBadge = document.getElementById('detailTickerBadge');
            if(card.ticker && card.ticker.trim() !== '') {
                tickerBadge.innerText = `티커: ${card.ticker}`;
                tickerBadge.classList.remove('hidden');
            } else {
                tickerBadge.classList.add('hidden');

            const priceReturnBox = document.getElementById('detailPriceReturnBox');
            if(card.buyPrice && card.buyPrice.toString().trim() !== '') {
                const buy = parseFloat(card.buyPrice);
                document.getElementById('detailBuyPrice').innerText = Number(buy).toLocaleString();
                
                const sellEl = document.getElementById('detailSellPrice');
                const rateEl = document.getElementById('detailReturnRate');
                
                if(card.sellPrice && card.sellPrice.toString().trim() !== '') {
                    const sell = parseFloat(card.sellPrice);
                    sellEl.innerText = Number(sell).toLocaleString();
                    const rate = ((sell - buy) / buy) * 100;
                    if(rate > 0) {
                        rateEl.innerHTML = `<span class="text-red-500 font-bold">+${rate.toFixed(2)}%</span>`;
                    } else if(rate < 0) {
                        rateEl.innerHTML = `<span class="text-blue-600 font-bold">${rate.toFixed(2)}%</span>`;
                    } else {
                        rateEl.innerHTML = `<span class="text-slate-700 font-bold">0.00%</span>`;
                    }

                    sellEl.innerText = '미입력';
                    rateEl.innerHTML = `<span class="text-slate-500 font-medium">보유 중</span>`;
                }

            } else {
                priceReturnBox.classList.add('hidden');
            }

            // 이미지 캐러셀 슬라이더 구성
            currentDetailImages = Array.isArray(card.images) && card.images.length > 0 ? 
                                 card.images : (card.image ? [card.image] : []);

            document.getElementById('detailModal').classList.remove('hidden');

        function renderDetailCarousel() {
            const wrapper = document.getElementById('detailCarouselWrapper');
            const track = document.getElementById('carouselTrack');
            const prevBtn = document.getElementById('carouselPrevBtn');
            const nextBtn = document.getElementById('carouselNextBtn');
            const counter = document.getElementById('carouselCounter');

            if (!wrapper || !track) return;

            if (currentDetailImages.length === 0) {
                wrapper.classList.add('hidden');
                return;
            }

            wrapper.classList.remove('hidden');
            
            track.innerHTML = currentDetailImages.map((src, idx) => `
                <div class="w-full shrink-0 flex items-center justify-center cursor-pointer" onclick="openLightboxFromDetail(${idx})">
                    <img src="${src}" class="w-full max-h-52 sm:max-h-64 object-contain bg-slate-950" alt="첨부 이미지 ${idx+1}">
                </div>
            `).join('');

            updateCarouselPosition();

            // 터치 슬라이드 이벤트 등록
            wrapper.ontouchstart = (e) => { touchStartX = e.touches[0].clientX; };
            wrapper.ontouchmove = (e) => { touchEndX = e.touches[0].clientX; };
            wrapper.ontouchend = () => {
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 30) {
                    if (diff > 0) window.nextSlide();
                    else window.prevSlide();
                }
                touchStartX = 0;
                touchEndX = 0;
            };
        }

        function updateCarouselPosition() {
            const track = document.getElementById('carouselTrack');
            const prevBtn = document.getElementById('carouselPrevBtn');
            const nextBtn = document.getElementById('carouselNextBtn');
            const counter = document.getElementById('carouselCounter');

            if (!track) return;

            track.style.transform = `translateX(-${currentSlideIndex * 100}%)`;

            if (counter) {
                counter.innerText = `${currentSlideIndex + 1} / ${currentDetailImages.length}`;
            }

            if (currentDetailImages.length <= 1) {
                if (prevBtn) prevBtn.classList.add('hidden');
                if (nextBtn) nextBtn.classList.add('hidden');
            } else {
                if (prevBtn) prevBtn.classList.toggle('hidden', currentSlideIndex === 0);
                if (nextBtn) nextBtn.classList.toggle('hidden', currentSlideIndex === currentDetailImages.length - 1);
            }
        }

        window.prevSlide = function(e) {
            if (e) e.stopPropagation();
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                updateCarouselPosition();
            }
        };

        window.nextSlide = function(e) {
            if (e) e.stopPropagation();
            if (currentSlideIndex < currentDetailImages.length - 1) {
                currentSlideIndex++;
                updateCarouselPosition();
            }
        };

        window.closeDetailModal = function() {
            document.getElementById('detailModal').classList.add('hidden');
            currentViewingId = null;
            try {
                if (history.pushState && window.location.protocol.startsWith('http')) {
                    const newurl = window.location.origin + window.location.pathname;
                    window.history.pushState({path:newurl},'',newurl);
                }
            } catch(e) {
                console.warn("History pushState skipped in preview environment:", e);
            }
        };

        window.openLightboxFromDetail = function(index) {
            const idx = (typeof index === 'number') ? index : currentSlideIndex;
            if(currentDetailImages[idx]) {
                document.getElementById('lightboxImg').src = currentDetailImages[idx];
                document.getElementById('imageLightboxModal').classList.remove('hidden');
            }
        };

        window.closeLightbox = function() {
            document.getElementById('imageLightboxModal').classList.add('hidden');
        };

        window.copyCurrentLink = function() {
            const card = cards.find(c => c.id == currentViewingId);
            if (!card) return;

            let baseUrl = window.location.href.split('?')[0].replace(/\/$/, '');
            if (baseUrl.startsWith('blob:') || !baseUrl.startsWith('http')) {
                baseUrl = 'https://mpltonnote.firebaseapp.com';
            }
            const shareUrl = `${baseUrl}?id=${card.id}`;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showCustomAlert('링크 복사 완료', '게시물 공유 링크가 클립보드에 복사되었습니다.');
                }).catch(() => {
                    fallbackCopyText(shareUrl);
                });
            } else {
                fallbackCopyText(shareUrl);
            }
        };

        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showCustomAlert('링크 복사 완료', '링크가 클립보드에 복사되었습니다.');
            } catch (err) {
                showCustomAlert('공유 실패', '클립보드 복사를 지원하지 않는 환경입니다.');
            }
            document.body.removeChild(textArea);
        }

        window.saveCard = async function() {
            const editId = document.getElementById('editCardId').value;
            const date = document.getElementById('writeDate').value;
            const type = 'public';
            const tag = document.getElementById('writeTag').value;
            const ticker = document.getElementById('writeTicker').value.trim().toUpperCase();
            const buyPrice = document.getElementById('writeBuyPrice').value;
            const sellPrice = document.getElementById('writeSellPrice').value;
            const title = document.getElementById('writeTitle').value.trim();
            const memo = document.getElementById('writeMemo').value.trim();

            if(!date || !title || !memo) {
                showCustomAlert('입력 오류', '날짜, 제목, 상세 내용을 모두 입력해주세요.');
                return;
            }

            processCardSave(editId, date, type, tag, ticker, buyPrice, sellPrice, title, memo, selectedWriteImages);
        };

        async function processCardSave(editId, date, type, tag, ticker, buyPrice, sellPrice, title, memo, imagesArray) {
            const firstImage = imagesArray && imagesArray.length > 0 ? imagesArray[0] : '';
            const cardData = {
                date,
                type,
                tag,
                ticker,
                buyPrice: buyPrice || '',
                sellPrice: sellPrice || '',
                title,
                memo,
                image: firstImage,
                images: imagesArray || []
            };

            const targetId = editId ? editId.toString() : ('card-' + Date.now());
            cardData.id = targetId;

            if(db) {
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'insights', targetId), cardData);
                } catch(e) {
                    console.warn("Firestore write error:", e.message);
                }
            }

            let localCards = JSON.parse(localStorage.getItem('mp_cards_v20')) || [];
            if(editId) {
                localCards = localCards.map(c => c.id == editId ? { ...c, ...cardData } : c);
            } else {
                localCards.unshift(cardData);
            }

            try {
                localStorage.setItem('mp_cards_v20', JSON.stringify(localCards));
            } catch(e) {
                showCustomAlert('저장 경고', '로컬 용량이 부족하여 클라우드에만 동기화되었습니다.');
            }

            closeWriteModal();
            fetchCloudOnce();
            mergeCards();
            showCustomAlert('저장 완료', '관점 기록이 성공적으로 저장되었습니다.');
        }

        window.editCurrentCard = function() {
            const card = cards.find(c => c.id == currentViewingId);
            if(!card) return;

            closeDetailModal();
            document.getElementById('writeModalHeading').innerText = '관점 기록 수정';
            document.getElementById('editCardId').value = card.id;
            document.getElementById('writeDate').value = card.date;
            document.getElementById('writeTag').value = card.tag || '기타';
            document.getElementById('writeTicker').value = card.ticker || '';
            document.getElementById('writeBuyPrice').value = card.buyPrice || '';
            document.getElementById('writeSellPrice').value = card.sellPrice || '';
            calcReturnRate();
            document.getElementById('writeTitle').value = card.title;
            document.getElementById('writeMemo').value = card.memo;
            document.getElementById('writeImage').value = '';

            selectedWriteImages = Array.isArray(card.images) && card.images.length > 0 ? [...card.images] : (card.image ? [card.image] : []);
            renderWriteImagePreviews();

            openWriteModal(true);
        };

        window.deleteCurrentCard = async function() {
            const card = cards.find(c => c.id == currentViewingId);
            if(!card) return;

            showCustomAlert('메모 삭제', '이 관점 기록을 정말 삭제하시겠습니까?', async () => {
                if(db) {
                    try {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'insights', card.id.toString()));
                    } catch(e) {
                        console.warn("Firestore delete notice:", e.message);
                    }
                }
                let localCards = JSON.parse(localStorage.getItem('mp_cards_v20')) || [];
                localCards = localCards.filter(c => c.id != currentViewingId);
                remotePublicCards = remotePublicCards.filter(c => c.id != currentViewingId);
                localStorage.setItem('mp_cards_v20', JSON.stringify(localCards));

                closeDetailModal();
                mergeCards();
            });
        };

        window.deleteCard = async function(event, id) {
            event.stopPropagation();
            const card = cards.find(c => c.id == id);
            if(!card) return;

            showCustomAlert('메모 삭제', '이 관점 기록을 삭제하시겠습니까?', async () => {
                if(db) {
                    try {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'insights', id.toString()));
                    } catch(e) {
                        console.warn("Firestore delete notice:", e.message);
                    }
                }
                let localCards = JSON.parse(localStorage.getItem('mp_cards_v20')) || [];
                localCards = localCards.filter(c => c.id != id);
                remotePublicCards = remotePublicCards.filter(c => c.id != id);
                localStorage.setItem('mp_cards_v20', JSON.stringify(localCards));

                mergeCards();
            });
        };

        window.renderCards = function() {
            const grid = document.getElementById('cardGrid');
            const searchInput = document.getElementById('searchInput');
            const tagFilterSelect = document.getElementById('tagFilter');
            if(!grid || !searchInput || !tagFilterSelect) return;

            const keyword = searchInput.value.toLowerCase();
            const tagFilter = tagFilterSelect.value;
            const now = new Date();

            let filtered = cards.filter(card => {
                const matchTag = (tagFilter === 'all' || card.tag === tagFilter);
                const matchMonth = (currentMonthFilter === 'all' || (card.date && card.date.startsWith(currentMonthFilter)));
                const matchKeyword = (card.title && card.title.toLowerCase().includes(keyword)) || 
                                     (card.memo && card.memo.toLowerCase().includes(keyword)) || 
                                     (card.date && card.date.includes(keyword)) || 
                                     (card.ticker && card.ticker.toLowerCase().includes(keyword));
                return matchTag && matchMonth && matchKeyword;
            });

            let unreadNewCount = 0;
            cards.forEach(card => {
                const cardDate = new Date(card.date);
                const diffHours = (now - cardDate) / (1000 * 60 * 60);
                if(diffHours <= 24 && !readPublicCardIds.includes(card.id)) {
                    unreadNewCount++;
                }
            });

            const navBadge = document.getElementById('pubNewBadgeNav');
            if(navBadge) {
                if(unreadNewCount > 0) {
                    navBadge.innerText = unreadNewCount + '개 NEW';
                    navBadge.classList.remove('hidden');
                } else {
                    navBadge.classList.add('hidden');
                }
            }

            if(filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-12 text-center flex flex-col items-center justify-center gap-2.5 bg-white rounded-3xl border border-slate-200 p-6 shadow-sm">
                        <div class="w-12 h-12 rounded-2xl bg-blue-50 text-[#2563EB] flex items-center justify-center text-lg font-bold border border-blue-200">👁️</div>
                        <h3 class="text-sm sm:text-base font-bold text-slate-800">등록된 관점 기록이 없습니다</h3>
                        <p class="text-xs sm:text-sm text-slate-500 max-w-sm leading-relaxed">운영자 로그인 후 '+ 새 메모' 버튼을 눌러 인사이츠를 기록해보세요.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = '';
            filtered.forEach(card => {
                const safeTitle = escapeHtml(card.title);
                const safeMemo = escapeHtml(card.memo);
                const safeTicker = escapeHtml(card.ticker);
                const safeTag = escapeHtml(card.tag);

                const cardImages = Array.isArray(card.images) && card.images.length > 0 ? card.images : (card.image ? [card.image] : []);
                const mainThumb = cardImages.length > 0 ? cardImages[0] : null;

                let thumbHtml = mainThumb ? 
                    `<div class="relative w-full h-36 sm:h-40 bg-slate-100 overflow-hidden">
                        <img src="${mainThumb}" class="w-full h-full object-cover" alt="썸네일" onerror="this.src='https://placehold.co/400x160/0F172A/3B82F6?text=Investment+View'">
                        ${cardImages.length > 1 ? `<span class="absolute bottom-2 right-2 bg-slate-900/80 text-white font-bold px-2 py-0.5 rounded-full text-xs backdrop-blur-sm">🖼️ ${cardImages.length}</span>` : ''}
                     </div>` : 
                    `<div class="w-full h-20 bg-gradient-to-r from-slate-900 via-slate-800 to-blue-900 flex items-center justify-center text-blue-200 font-bold text-xs sm:text-sm tracking-wider border-b border-slate-700">👁️ MYUNGPLETON VIEW</div>`;
                
                let tickerHtml = safeTicker ? `<span class="bg-slate-100 text-slate-700 font-bold px-1.5 py-0.5 rounded text-xs">${safeTicker}</span>` : '';

                let newBadgeHtml = '';
                const cardDate = new Date(card.date);
                const diffHours = (now - cardDate) / (1000 * 60 * 60);
                if(diffHours <= 24 && !readPublicCardIds.includes(card.id)) {
                    newBadgeHtml = `<span class="bg-amber-500 text-white font-bold px-1.5 py-0.5 rounded text-xs new-badge-pulse shadow-sm">NEW</span>`;
                }

                let returnBadgeHtml = '';
                if(card.buyPrice && card.sellPrice && parseFloat(card.buyPrice) > 0) {
                    const r = ((parseFloat(card.sellPrice) - parseFloat(card.buyPrice)) / parseFloat(card.buyPrice)) * 100;
                    if(r > 0) {
                        returnBadgeHtml = `<span class="bg-red-50 text-red-600 border border-red-200 font-bold px-1.5 py-0.5 rounded text-xs">수익률 +${r.toFixed(1)}%</span>`;
                    } else if(r < 0) {
                        returnBadgeHtml = `<span class="bg-blue-50 text-blue-600 border border-blue-200 font-bold px-1.5 py-0.5 rounded text-xs">수익률 ${r.toFixed(1)}%</span>`;
                    }
                } else if(card.buyPrice) {
                    returnBadgeHtml = `<span class="bg-slate-100 text-slate-600 border border-slate-200 font-bold px-1.5 py-0.5 rounded text-xs">보유 중</span>`;
                }

                let deleteBtnHtml = isOperator ? `<button onclick="deleteCard(event, '${card.id}')" class="text-slate-400 hover:text-rose-600 p-0.5 rounded transition font-medium text-xs sm:text-sm">삭제</button>` : '';

                let footerHtml = isOperator ? `
                    <div class="px-3.5 py-1.5 bg-slate-50/70 border-t border-slate-100 flex justify-end items-center">
                        ${deleteBtnHtml}
                    </div>` : '';

                grid.innerHTML += `
                    <div onclick="openDetailModal('${card.id}')" class="bg-white rounded-2xl border border-slate-200 overflow-hidden cursor-pointer transition-all duration-200 hover:-translate-y-1 hover:shadow-lg flex flex-col group hover:border-blue-200">
                        ${thumbHtml}
                        <div class="p-3.5 sm:p-4 flex flex-col gap-2 flex-1">
                            <div class="flex justify-between items-center">
                                <span class="text-xs text-slate-400 font-semibold">${card.date}</span>
                                <div class="flex items-center gap-1 flex-wrap justify-end">
                                    ${newBadgeHtml}
                                    ${tickerHtml}
                                    ${returnBadgeHtml}
                                    <span class="text-xs px-1.5 py-0.5 rounded font-bold bg-slate-100 text-slate-700">${safeTag}</span>
                                </div>
                            </div>
                            <h3 class="text-sm sm:text-base font-bold text-slate-900 line-clamp-2 leading-snug group-hover:text-[#2563EB] transition">${safeTitle}</h3>
                            <p class="text-xs sm:text-sm text-slate-500 line-clamp-2 leading-relaxed">${safeMemo}</p>
                        </div>
                        ${footerHtml}
                    </div>
                `;
            });
        };
    </script>
</body>
</html>
