<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명플턴의 인사이츠 아카이브</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e8eb; border-radius: 9999px; }
        @keyframes pulseNew {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.05); }
        }
        .new-badge-pulse { animation: pulseNew 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-[#F7F6F3] text-[#2C2C2A] h-screen flex overflow-hidden select-none">

    <!-- Custom Alert/Confirm Dialog Modal -->
    <div id="customDialog" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[9999] hidden flex items-center justify-center p-4">
        <div class="bg-[#FFFEFC] rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-[#E8E6DF] transform transition-all flex flex-col gap-4">
            <h3 id="dialogTitle" class="text-lg font-bold text-gray-900">알림</h3>
            <p id="dialogMessage" class="text-sm text-gray-600 leading-relaxed"></p>
            <div id="dialogButtons" class="flex gap-2 justify-end mt-2">
                <button id="dialogConfirm" class="px-4 py-2 bg-[#D94F3D] text-white rounded-xl text-sm font-semibold hover:bg-[#C23F2D] transition shadow-sm">확인</button>
                <button id="dialogCancel" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-xl text-sm font-semibold hover:bg-gray-200 transition hidden">취소</button>
            </div>
        </div>
    </div>

    <!-- Image Lightbox Modal -->
    <div id="imageLightboxModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[99999] hidden flex items-center justify-center p-4" onclick="closeLightbox()">
        <div class="relative max-w-7xl max-h-screen w-full h-full flex items-center justify-center p-2" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" class="absolute top-6 right-6 w-12 h-12 rounded-full bg-white/10 text-white hover:bg-white/20 flex items-center justify-center text-2xl font-bold transition z-10">✕</button>
            <img id="lightboxImg" class="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl" alt="원본 이미지 확대">
        </div>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-[#FFFEFC] border-r border-[#E8E6DF] flex flex-col justify-between p-5 transition-all duration-300 z-30 absolute md:relative h-full -translate-x-full md:translate-x-0 shadow-xl md:shadow-none">
        <div class="flex flex-col h-full">
            <div class="flex items-center justify-between mb-6 px-2">
                <div class="flex items-center gap-2.5 font-bold text-xl tracking-tight text-[#2C2C2A]">
                    <div class="w-9 h-9 rounded-xl bg-[#FDF3F2] flex items-center justify-center text-[#D94F3D] shadow-inner border border-[#F4D1CD]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <span>명플턴의 <span class="text-[#D94F3D]">레터함</span></span>
                </div>
                <button onclick="toggleMobileSidebar()" class="md:hidden text-gray-400 hover:text-gray-700 p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto pr-1">
                <div class="flex items-center justify-between px-2 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">
                    <span>아카이브 편지함</span>
                </div>
                <ul class="space-y-1.5">
                    <li onclick="selectTab('public')" id="tabPublic" class="flex items-center justify-between px-3.5 py-3 rounded-xl cursor-pointer text-sm font-semibold transition bg-[#FDF3F2] text-[#D94F3D] border border-[#F4D1CD]">
                        <span class="flex items-center gap-2.5">
                            <svg class="w-4 h-4 text-[#D94F3D]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            명플턴 뷰
                        </span>
                        <span id="pubNewBadgeNav" class="hidden text-[10px] bg-[#D94F3D] text-white font-bold px-1.5 py-0.5 rounded-full new-badge-pulse">NEW</span>
                    </li>
                </ul>
            </div>
        </div>

        <div class="pt-4 border-t border-[#E8E6DF] flex flex-col gap-2">
            <div id="authStatusText" class="text-xs text-gray-500 text-center font-medium">비로그인 (읽기 전용)</div>
            <button onclick="handleAuthButtonClick()" id="operatorToggleBtn" class="w-full py-2.5 bg-[#FAF8F5] hover:bg-[#F4F2EC] text-gray-700 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1.5 border border-[#E8E6DF]">
                운영자 로그인
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="bg-[#FFFEFC] border-b border-[#E8E6DF] px-6 py-4 flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 min-h-[76px] shadow-sm z-20">
            <div class="flex items-center gap-3">
                <button onclick="toggleMobileSidebar()" class="md:hidden p-2 rounded-xl bg-gray-100 text-gray-600 hover:bg-gray-200 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div>
                    <h1 id="currentTabTitle" class="text-xl font-bold tracking-tight text-[#2C2C2A]">명플턴 뷰</h1>
                    <p id="currentTabSub" class="text-xs text-gray-500 font-medium">운영자가 공식 발행한 투자 인사이츠와 편지함입니다.</p>
                </div>
            </div>

            <div class="flex items-center gap-3 flex-wrap md:flex-nowrap">
                <select id="tagFilter" onchange="renderCards()" class="bg-[#FAF8F5] border border-[#E8E6DF] text-gray-700 text-sm rounded-xl px-3.5 py-2.5 outline-none focus:border-[#D94F3D] transition font-medium">
                    <option value="all">🏷️ 전체 태그</option>
                    <option value="매수 관점">📈 매수 관점</option>
                    <option value="매도 관점">📉 매도 관점</option>
                    <option value="기업 분석">💡 기업 분석</option>
                    <option value="익절">✨ 익절</option>
                    <option value="손절">🛡️ 손절</option>
                    <option value="기타">📌 기타</option>
                </select>

                <div class="relative flex-1 md:w-64">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                    <input type="text" id="searchInput" placeholder="종목, 키워드 검색..." oninput="renderCards()" class="w-full pl-10 pr-4 py-2.5 bg-[#FAF8F5] border border-[#E8E6DF] rounded-xl text-sm outline-none focus:border-[#D94F3D] focus:bg-white transition">
                </div>

                <button id="writeMemoHeaderBtn" onclick="openWriteModal()" class="hidden bg-[#D94F3D] hover:bg-[#C23F2D] text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-md shadow-red-500/10 transition flex items-center gap-2 whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                    새 메모 작성
                </button>
            </div>
        </header>

        <!-- Monthly Timeline Category Bar -->
        <div class="bg-[#FFFEFC] border-b border-[#E8E6DF] px-6 py-2.5 flex items-center gap-2 overflow-x-auto z-10 shrink-0" id="monthlyBarContainer">
            <!-- Populated dynamically via JS -->
        </div>

        <!-- Content Grid Area -->
        <div class="flex-1 p-6 md:p-8 overflow-y-auto bg-[#F7F6F3]">
            <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                <!-- Cards populated via script -->
            </div>
        </div>
    </main>

    <!-- Write/Edit Modal -->
    <div id="writeModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-[#FFFEFC] border border-[#E8E6DF] rounded-3xl max-w-xl w-full p-7 shadow-2xl transform transition-all flex flex-col gap-5 my-8">
            <div class="flex justify-between items-center border-b border-[#E8E6DF] pb-4">
                <div>
                    <h2 id="writeModalHeading" class="text-lg font-bold text-gray-900">새 주식 인사이츠 기록</h2>
                    <p class="text-xs text-gray-500 font-medium">명플턴 뷰 인사이츠 편지글을 기록하세요 (운영자 전용).</p>
                </div>
                <button onclick="closeWriteModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition">✕</button>
            </div>

            <input type="hidden" id="editCardId" value="">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-gray-500">기록 일자</label>
                    <input type="date" id="writeDate" class="p-3 bg-[#FAF8F5] border border-[#E8E6DF] rounded-xl text-sm outline-none focus:border-[#D94F3D] focus:bg-white transition font-medium">
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-gray-500">게시 편지함</label>
                    <input type="text" readonly value="💌 명플턴 뷰 (운영자 전용 발행)" class="p-3 bg-gray-100 border border-[#E8E6DF] rounded-xl text-sm text-gray-600 font-medium cursor-not-allowed">
                    <input type="hidden" id="writeType" value="public">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-gray-500">태그</label>
                    <select id="writeTag" class="p-3 bg-[#FAF8F5] border border-[#E8E6DF] rounded-xl text-sm outline-none focus:border-[#D94F3D] focus:bg-white transition font-medium">
                        <option value="매수 관점">📈 매수 관점</option>
                        <option value="매도 관점">📉 매도 관점</option>
                        <option value="기업 분석">💡 기업 분석</option>
                        <option value="익절">✨ 익절</option>
                        <option value="손절">🛡️ 손절</option>
                        <option value="기타">📌 기타</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-gray-500">종목 코드/티커</label>
                    <input type="text" id="writeTicker" placeholder="예: NVDA" class="p-3 bg-[#FAF8F5] border border-[#E8E6DF] rounded-xl text-sm outline-none focus:border-[#D94F3D] focus:bg-white transition font-medium">
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-gray-500">매수가 (원/달러)</label>
                    <input type="number" id="writeBuyPrice" placeholder="예: 120000" oninput="calcReturnRate()" class="p-3 bg-[#FAF8F5] border border-[#E8E6DF] rounded-xl text-sm outline-none focus:border-[#D94F3D] focus:bg-white transition font-medium">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-gray-500">매도가 (원/달러)</label>
                    <input type="number" id="writeSellPrice" placeholder="예: 150000" oninput="calcReturnRate()" class="p-3 bg-[#FAF8F5] border border-[#E8E6DF] rounded-xl text-sm outline-none focus:border-[#D94F3D] focus:bg-white transition font-medium">
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-gray-500">자동 계산된 수익률</label>
                    <div id="returnRateDisplay" class="p-3 bg-[#FAF8F5] border border-[#E8E6DF] rounded-xl text-sm font-bold text-gray-400 flex items-center h-[46px]">
                        매수가와 매도가 입력 시 자동 계산
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold text-gray-500">메모 제목 / 종목명</label>
                <input type="text" id="writeTitle" placeholder="예: 엔비디아 2분기 실적 리뷰 및 가이던스 분석" class="p-3 bg-[#FAF8F5] border border-[#E8E6DF] rounded-xl text-sm outline-none focus:border-[#D94F3D] focus:bg-white transition font-medium">
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold text-gray-500">차트/스크린샷 첨부</label>
                <input type="file" id="writeImage" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[#FDF3F2] file:text-[#D94F3D] hover:file:bg-[#F9E5E3] cursor-pointer">
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold text-gray-500">상세 편지 내용</label>
                <textarea id="writeMemo" rows="5" placeholder="투자 핵심 지표, 밸류에이션, 목표가, 체크포인트 등을 자유롭게 기록하세요..." class="p-3 bg-[#FAF8F5] border border-[#E8E6DF] rounded-xl text-sm outline-none focus:border-[#D94F3D] focus:bg-white transition font-medium resize-y"></textarea>
            </div>

            <button onclick="saveCard()" class="w-full py-3.5 bg-[#D94F3D] hover:bg-[#C23F2D] text-white rounded-2xl font-bold text-sm shadow-lg shadow-red-500/10 transition">인사이츠 저장하기</button>
        </div>
    </div>

    <!-- Detail View Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-[#FFFEFC] border border-[#E8E6DF] rounded-3xl max-w-2xl w-full p-7 shadow-2xl transform transition-all flex flex-col gap-5 my-8 max-h-[90vh]">
            <div class="flex justify-between items-center border-b border-[#E8E6DF] pb-4">
                <div>
                    <span id="detailTypeBadge" class="bg-[#FDF3F2] text-[#D94F3D] text-[10px] px-2.5 py-1 rounded-md font-bold mb-1.5 inline-block">명플턴 뷰</span>
                    <span id="detailTickerBadge" class="hidden bg-gray-100 text-gray-800 text-[10px] px-2.5 py-1 rounded-md font-bold mb-1.5 inline-block"></span>
                    <h2 id="detailTitle" class="text-xl font-bold text-gray-900 leading-snug"></h2>
                </div>
                <button onclick="closeDetailModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition">✕</button>
            </div>

            <div class="flex justify-between items-center text-xs text-gray-500 font-medium">
                <span id="detailDateTag"></span>
                <span id="detailTagBadge" class="bg-[#FDF3F2] text-[#D94F3D] px-2.5 py-1 rounded-lg font-semibold"></span>
            </div>

            <!-- Price & Return Box (Visible even if sell price is not entered) -->
            <div id="detailPriceReturnBox" class="hidden grid grid-cols-3 gap-3 p-4 bg-[#FAF8F5] border border-[#E8E6DF] rounded-2xl text-xs font-semibold">
                <div><span class="text-gray-400 block mb-1">매수가</span><span id="detailBuyPrice" class="text-gray-800 text-sm font-bold">-</span></div>
                <div><span class="text-gray-400 block mb-1">매도가</span><span id="detailSellPrice" class="text-gray-800 text-sm font-bold">-</span></div>
                <div><span class="text-gray-400 block mb-1">수익률</span><span id="detailReturnRate" class="text-sm font-bold">-</span></div>
            </div>

            <div class="overflow-y-auto flex-1 space-y-4 pr-1">
                <div class="relative group cursor-pointer inline-block w-full" onclick="openLightboxFromDetail()">
                    <img id="detailImg" class="w-full max-h-72 object-cover rounded-2xl bg-gray-100 shadow-sm hidden transition group-hover:brightness-95" alt="첨부 이미지">
                    <div id="imageZoomHint" class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition rounded-2xl flex items-center justify-center text-white text-xs font-bold gap-1.5 pointer-events-none hidden">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                        클릭하여 원본 보기
                    </div>
                </div>
                <div id="detailMemo" class="text-sm leading-relaxed text-gray-800 bg-[#FAF8F5] border border-[#E8E6DF] p-5 rounded-2xl whitespace-pre-wrap break-all"></div>
            </div>

            <div class="flex justify-between items-center pt-3 border-t border-[#E8E6DF]">
                <div class="flex gap-2" id="ownerActionButtons">
                    <button id="ownerEditBtn" onclick="editCurrentCard()" class="hidden px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">수정하기</button>
                    <button onclick="shareCurrentCard()" class="px-4 py-2 bg-[#FDF3F2] text-[#D94F3D] hover:bg-[#F9E5E3] rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                        공유하기 (링크)
                    </button>
                </div>
                <button onclick="deleteCurrentCard()" id="ownerDeleteButton" class="hidden px-4 py-2 bg-[#FDF3F2] hover:bg-[#F9E5E3] text-[#D94F3D] rounded-xl text-xs font-semibold transition flex items-center gap-1.5">메모 삭제</button>
            </div>
        </div>
    </div>

    <!-- Firebase & Main Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, setDoc, doc, deleteDoc, onSnapshot, query, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'myungpleton-insights-v15';
        
        // Exact user Firebase configuration provided
        const firebaseConfig = {
            apiKey: "AIzaSyDgkXKBkeul05Q-X6wmdN8yGhoS2PVXwmE",
            authDomain: "mpltonnote.firebaseapp.com",
            projectId: "mpltonnote",
            storageBucket: "mpltonnote.firebasestorage.app",
            messagingSenderId: "16917679499",
            appId: "1:16917679499:web:58ff7dccbbdc96ef3a338e",
            measurementId: "G-E5YZP0JXLZ"
        };

        let app, db, auth, analytics;
        let isFirebaseConnected = false;
        
        let remotePublicCards = [];
        let cards = [];
        
        let currentMonthFilter = 'all';
        let currentViewingId = null;
        let currentUserEmail = null;
        const ADMIN_EMAIL = 'uc1306@hanmail.net';
        let isOperator = false;

        let readPublicCardIds = JSON.parse(localStorage.getItem('mp_read_public_ids_v15')) || [];

        document.getElementById('writeDate').valueAsDate = new Date();

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            try {
                analytics = getAnalytics(app);
            } catch(e) {}
            
            isFirebaseConnected = true;
            initFirestoreSync();

            onAuthStateChanged(auth, (user) => {
                if(user && user.email) {
                    currentUserEmail = user.email;
                    isOperator = (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
                } else {
                    currentUserEmail = null;
                    isOperator = false;
                }
                updateOperatorUI();
                renderCards();
            });
        } catch(e) {
            console.warn("Firebase initialization notice:", e);
            initLocalMode();
        }

        function initFirestoreSync() {
            if(!db) {
                initLocalMode();
                return;
            }
            const publicColRef = collection(db, 'artifacts', appId, 'public', 'data', 'insights');
            
            onSnapshot(query(publicColRef), (snapshot) => {
                remotePublicCards = [];
                snapshot.forEach(docSnap => {
                    remotePublicCards.push({ id: docSnap.id, ...docSnap.data() });
                });
                mergeCards();
            }, (error) => {
                console.warn("Firestore sync error, fallback to getDocs:", error.message);
                getDocs(publicColRef).then(snapshot => {
                    remotePublicCards = [];
                    snapshot.forEach(docSnap => {
                        remotePublicCards.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    mergeCards();
                }).catch(err => {
                    console.warn("Firestore offline fallback:", err);
                    initLocalMode();
                });
            });
        }

        function initLocalMode() {
            isFirebaseConnected = false;
            mergeCards();
        }

        function mergeCards() {
            const localCards = JSON.parse(localStorage.getItem('mp_cards_v15')) || [];
            const map = new Map();
            // Cloud takes precedence or local cache as backup
            localCards.forEach(c => map.set(c.id, c));
            remotePublicCards.forEach(c => map.set(c.id, c));

            cards = Array.from(map.values()).sort((a,b) => new Date(b.date) - new Date(a.date));
            initApp();
        }

        window.calcReturnRate = function() {
            const buy = parseFloat(document.getElementById('writeBuyPrice').value);
            const sell = parseFloat(document.getElementById('writeSellPrice').value);
            const display = document.getElementById('returnRateDisplay');

            if(!isNaN(buy) && !isNaN(sell) && buy > 0) {
                const rate = ((sell - buy) / buy) * 100;
                const formatted = rate.toFixed(2);
                if(rate > 0) {
                    display.innerHTML = `<span class="text-red-500 font-bold">+${formatted}% (수익 📈)</span>`;
                } else if(rate < 0) {
                    display.innerHTML = `<span class="text-blue-500 font-bold">${formatted}% (손실 📉)</span>`;
                } else {
                    display.innerHTML = `<span class="text-gray-600 font-bold">0.00% (본전)</span>`;
                }
            } else if(!isNaN(buy) && buy > 0) {
                display.innerHTML = `<span class="text-gray-500 font-medium">매수가 등록됨 (보유 중)</span>`;
            } else {
                display.innerHTML = `<span class="text-gray-400">매수가와 매도가 입력 시 자동 계산</span>`;
            }
        }

        function renderMonthlyBar() {
            const bar = document.getElementById('monthlyBarContainer');
            
            const monthsSet = new Set();
            cards.forEach(c => {
                if(c.date && c.date.length >= 7) {
                    monthsSet.add(c.date.substring(0, 7));
                }
            });

            const sortedMonths = Array.from(monthsSet).sort((a, b) => b.localeCompare(a));

            let html = `
                <button onclick="selectMonthFilter('all')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${currentMonthFilter === 'all' ? 'bg-[#D94F3D] text-white shadow-sm' : 'bg-[#FAF8F5] text-gray-600 hover:bg-[#F0EEE6] border border-[#E8E6DF]'}">
                    📅 전체 월별보기
                </button>
            `;

            sortedMonths.forEach(m => {
                const [year, month] = m.split('-');
                const label = `${year}년 ${parseInt(month)}월`;
                const isActive = (currentMonthFilter === m);
                html += `
                    <button onclick="selectMonthFilter('${m}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${isActive ? 'bg-[#D94F3D] text-white shadow-sm' : 'bg-[#FAF8F5] text-gray-600 hover:bg-[#F0EEE6] border border-[#E8E6DF]'}">
                        🗓️ ${label}
                    </button>
                `;
            });

            bar.innerHTML = html;
        }

        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showCustomAlert('링크 복사 완료', '다이렉트 링크가 클립보드에 복사되었습니다!');

        window.saveCard = function() {
            const editId = document.getElementById('editCardId').value;
            const date = document.getElementById('writeDate').value;
            const type = 'public';
            const tag = document.getElementById('writeTag').value;
            const ticker = document.getElementById('writeTicker').value.trim().toUpperCase();
            const buyPrice = document.getElementById('writeBuyPrice').value;
            const sellPrice = document.getElementById('writeSellPrice').value;
            const title = document.getElementById('writeTitle').value.trim();
            const memo = document.getElementById('writeMemo').value.trim();
            const imageInput = document.getElementById('writeImage');

            if(!date || !title || !memo) {
                showCustomAlert('입력 오류', '날짜, 제목, 메모 내용을 모두 입력해주세요.');
                return;
            }

            if(imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processCardSave(editId, date, type, tag, ticker, buyPrice, sellPrice, title, memo, e.target.result);
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                let existingImage = null;
                if(editId) {
                    const existingCard = cards.find(c => c.id == editId);
                    if(existingCard) existingImage = existingCard.image;
                }
                processCardSave(editId, date, type, tag, ticker, buyPrice, sellPrice, title, memo, existingImage);
            }
        }

        async function processCardSave(editId, date, type, tag, ticker, buyPrice, sellPrice, title, memo, image) {
            const cardData = {
                date,
                type,
                tag,
                ticker,
                buyPrice: buyPrice || '',
                sellPrice: sellPrice || '',
                title,
                memo,
                image: image || ''
            };

            const targetId = editId ? editId.toString() : ('card-' + Date.now());
            cardData.id = targetId;

            // Save to Firestore cloud
            if(db) {
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'insights', targetId), cardData);
                } catch(e) {
                    console.warn("Firestore write notice:", e.message);
                }
            }

            // Save to local backup
            let localCards = JSON.parse(localStorage.getItem('mp_cards_v15')) || [];
            if(editId) {
                localCards = localCards.map(c => c.id == editId ? { ...c, ...cardData } : c);
            } else {
                localCards.unshift(cardData);
            }
            localStorage.setItem('mp_cards_v15', JSON.stringify(localCards));

            closeWriteModal();
            mergeCards();
            showCustomAlert('저장 완료', '인사이츠 편지가 성공적으로 저장되었습니다.');
        }

        window.renderCards = function() {
            const grid = document.getElementById('cardGrid');
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const tagFilter = document.getElementById('tagFilter').value;
            const now = new Date();

            let filtered = cards.filter(card => {
                const matchTag = (tagFilter === 'all' || card.tag === tagFilter);
                const matchMonth = (currentMonthFilter === 'all' || (card.date && card.date.startsWith(currentMonthFilter)));
                const matchKeyword = card.title.toLowerCase().includes(keyword) || 
                                     card.memo.toLowerCase().includes(keyword) || 
                                     card.date.includes(keyword) || 
                                     (card.ticker && card.ticker.toLowerCase().includes(keyword));
                return matchTag && matchMonth && matchKeyword;
            });

            let unreadNewCount = 0;
            cards.forEach(card => {
                const cardDate = new Date(card.date);
                const diffHours = (now - cardDate) / (1000 * 60 * 60);

                    unreadNewCount++;
                }
            });

            const navBadge = document.getElementById('pubNewBadgeNav');
            if(unreadNewCount > 0) {
                navBadge.innerText = `${unreadNewCount}개 NEW`;
                navBadge.classList.remove('hidden');

                    </div>
                `;
                return;
            }

            grid.innerHTML = '';
            filtered.forEach(card => {
                let thumbHtml = card.image ? 
                    `<img src="${card.image}" class="w-full h-40 object-cover bg-gray-100" alt="썸네일" onerror="this.src='https://placehold.co/400x160/FAF8F5/6B7684?text=Investment+Letter'">` :

                let tickerHtml = card.ticker ? `<span class="bg-gray-100 text-gray-700 font-bold px-2 py-0.5 rounded text-[10px]">${card.ticker}</span>` : '';

                let newBadgeHtml = '';
                const cardDate = new Date(card.date);
                const diffHours = (now - cardDate) / (1000 * 60 * 60);
                if(diffHours <= 24 && !readPublicCardIds.includes(card.id)) {
                    newBadgeHtml = `<span class="bg-[#D94F3D] text-white font-bold px-2 py-0.5 rounded text-[10px] new-badge-pulse shadow-sm">NEW</span>`;

                if(card.buyPrice && card.sellPrice) {
                    const r = ((parseFloat(card.sellPrice) - parseFloat(card.buyPrice)) / parseFloat(card.buyPrice)) * 100;
                    if(r > 0) {
                        returnBadgeHtml = `<span class="bg-red-50 text-red-600 border border-red-200 font-bold px-2 py-0.5 rounded text-[10px]">수익률 +${r.toFixed(1)}%</span>`;
                    } else if(r < 0) {
                        returnBadgeHtml = `<span class="bg-blue-50 text-blue-600 border border-blue-200 font-bold px-2 py-0.5 rounded text-[10px]">수익률 ${r.toFixed(1)}%</span>`;
                    }
                } else if(card.buyPrice) {
                    returnBadgeHtml = `<span class="bg-gray-100 text-gray-600 border border-gray-200 font-bold px-2 py-0.5 rounded text-[10px]">보유 중</span>`;
                }

                let deleteBtnHtml = isOperator ? `<button onclick="deleteCard(event, '${card.id}')" class="text-gray-400 hover:text-[#D94F3D] p-1 rounded transition font-medium">삭제</button>` : '';

                grid.innerHTML += `
                    <div onclick="openDetailModal('${card.id}')" class="bg-[#FFFEFC] rounded-2xl border border-[#E8E6DF] overflow-hidden cursor-pointer transition-all duration-200 hover:-translate-y-1 hover:shadow-xl flex flex-col group">
                        ${thumbHtml}
                        <div class="p-4 flex flex-col gap-2.5 flex-1">
                            <div class="flex justify-between items-center">
                                <span class="text-xs text-gray-400 font-semibold">${card.date}</span>
                                <div class="flex items-center gap-1.5 flex-wrap justify-end">
                                    ${newBadgeHtml}
                                    ${tickerHtml}
                                    ${returnBadgeHtml}
                                    <span class="text-[11px] px-2 py-0.5 rounded font-bold bg-[#FDF3F2] text-[#D94F3D]">${card.tag}</span>
                                </div>
                            </div>
                            <h3 class="text-sm font-bold text-gray-900 line-clamp-2 leading-snug group-hover:text-[#D94F3D] transition">${card.title}</h3>
                            <p class="text-xs text-gray-500 line-clamp-2 leading-relaxed">${card.memo}</p>
                        </div>
                        <div class="px-4 py-3 bg-[#FAF8F5]/50 border-t border-[#E8E6DF] flex justify-between items-center text-xs">
                            ${typeBadge}
                            ${deleteBtnHtml}
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
